name: weekly brand trend analyzer

on:
  schedule:
    - cron: '17 1 * * 6'   # 매주 토요일 KST 10:17 (정각 회피)
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pywebpush

      - name: Run brand analyzer
        env:
          GH_TOKEN:                 ${{ secrets.GH_DEPLOY_TOKEN }}
          GH_OWNER:                 nothing881122-netizen
          GH_REPO:                  flight-deals
          WEB_PUSH_VAPID_PRIVATE:   ${{ secrets.WEB_PUSH_VAPID_PRIVATE }}
          WEB_PUSH_SUBSCRIPTIONS:   ${{ secrets.WEB_PUSH_SUBSCRIPTIONS }}
          WEB_PUSH_SUBJECT:         ${{ secrets.WEB_PUSH_SUBJECT }}
        run: python brand_analyzer.py
