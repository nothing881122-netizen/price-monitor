name: flight probe (Google Flights 차단 테스트)

on:
  workflow_dispatch:   # 수동 실행 전용 (테스트)

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fast-flights
        run: pip install fast-flights

      - name: Probe Google Flights from Actions IP
        run: python flight_probe.py
