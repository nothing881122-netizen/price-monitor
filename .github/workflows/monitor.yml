name: algumon keyword hotdeal monitor

on:
  schedule:
    - cron: '0 0 * * *'   # KST 09:00
    - cron: '0 2 * * *'   # KST 11:00
    - cron: '0 4 * * *'   # KST 13:00
    - cron: '0 6 * * *'   # KST 15:00
    - cron: '0 8 * * *'   # KST 17:00
    - cron: '0 10 * * *'  # KST 19:00
  workflow_dispatch:       # 수동 실행 버튼

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    permissions:
      contents: write      # seen_ids.json 커밋용

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pywebpush

      - name: Run keyword monitor
        env:
          GH_TOKEN:                 ${{ secrets.GH_DEPLOY_TOKEN }}
          GH_OWNER:                 nothing881122-netizen
          GH_REPO:                  flight-deals
          GH_PATH:                  deals.html
          WEB_PUSH_VAPID_PRIVATE:   ${{ secrets.WEB_PUSH_VAPID_PRIVATE }}
          WEB_PUSH_SUBSCRIPTIONS:   ${{ secrets.WEB_PUSH_SUBSCRIPTIONS }}
          WEB_PUSH_SUBJECT:         ${{ secrets.WEB_PUSH_SUBJECT }}
          FORCE_RUN:                ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python price_monitor.py

      - name: Persist seen_ids.json + price_history.jsonl
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ids.json price_history.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update seen + history [skip ci]"
          git push
